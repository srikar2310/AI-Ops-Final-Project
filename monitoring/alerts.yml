# Evaluated by Prometheus (see http://localhost:9090/alerts). No Alertmanager: alerts are visible, not sent.
groups:
  - name: chess-rating
    rules:
      - alert: ApiDown
        expr: up{job="chess-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "The API is not being scraped (down?)"}
      - alert: HighErrorRate
        expr: >
          sum(rate(api_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(api_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "More than 5% of requests fail with 5xx"}
      - alert: NoStockfishEngines
        expr: stockfish_engines_available == 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "All Stockfish engines are busy or failed"}
      - alert: SlowPredictions
        expr: >
          histogram_quantile(0.95, sum by (le) (rate(api_request_latency_seconds_bucket{endpoint="/predict"}[5m]))) > 30
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "p95 /predict latency above 30 s"}
      - alert: InputDrift
        expr: feature_drift_max > 1
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Incoming game features moved more than 1 training std from the training mean; consider retraining (scripts/retrain.sh)"}