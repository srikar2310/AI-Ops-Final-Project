stages:
  evaluate:
    foreach:
      - train
      - val
      - test
    do:
      cmd: >-
        python Stockfish_train_eval.py
        --input dataset_clean/${item}
        --output dataset_clean/${item}_evaluated
        --meta metrics/eval_${item}.json
      deps:
        - Stockfish_train_eval.py
        - requirements.txt
        - dataset_clean/${item}
      params:
        - eval.depth
        - eval.hash_mb
        - eval.cache_plies
        - eval.mate_score
        - eval.engine_path
        - eval.stockfish_version
      outs:
        # persist: true keeps existing output so the script can resume after a crash
        - dataset_clean/${item}_evaluated:
            persist: true
      metrics:
        - metrics/eval_${item}.json:
            cache: false

  prepare:
    cmd: python prepare.py
    deps:
      - prepare.py
      - features.py
      - dataset_clean/train_evaluated
      - dataset_clean/val_evaluated
      - dataset_clean/test_evaluated
    params:
      - data.max_plies
      - data.min_plies
      - data.cp_clip
    outs:
      - data/processed
    metrics:
      - metrics/prepare.json:
          cache: false

  train:
    cmd: python train.py
    deps:
      - train.py
      - model.py
      - features.py
      - pyfunc_model.py
      - data/processed
    params:
      - train.seed
      - train.epochs
      - train.batch_size
      - train.lr
      - train.weight_decay
      - train.channels
      - train.kernel
      - train.dilations
      - train.dropout
      - train.hidden
      - train.use_features
      - train.feat_hidden
      - train.exclude_features
      - train.patience
    outs:
      - models/best.pt
      - models/config.json
    metrics:
      - metrics/train.json:
          cache: false