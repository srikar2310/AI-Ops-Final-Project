eval:
  depth: 11                          # Stockfish search depth
  hash_mb: 64                        # hash table per engine process
  cache_plies: 16                    # cache only the first N plies (0 = bit-exact reruns)
  mate_score: 10000                  # centipawn value used for forced mates
  engine_path: /usr/games/stockfish
  stockfish_version: "auto"          # "auto" = record whatever the engine reports

data:
  max_plies: 200                     # games longer than this are truncated
  min_plies: 10                      # shorter games are skipped
  cp_clip: 1500                      # centipawns are clipped to +/- this before conversion

train:
  seed: 42
  epochs: 40
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  channels: [32, 64, 64, 128]        # hidden conv channels
  kernel: 5
  dilations: [1, 2, 4, 8]            # must have the same length as channels
  dropout: 0.2
  hidden: 64
  patience: 6                        # early stopping, in epochs
  use_features: true                 # false = CNN only
  feat_hidden: 64
  exclude_features: []               # e.g. [result_score, result_known]
